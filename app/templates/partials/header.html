<header class="site-header">
    <a class="brand" href="/" aria-label="{{ site.name }}, inicio">
        <img class="brand-logo" src="{{ absolute_url(site_url, site.logo) }}" alt="{{ site.alternate_name }}">
        <span>
            <strong>{{ site.name }}</strong>
            <small>{{ site.alternate_name }}</small>
        </span>
    </a>
    <nav aria-label="Navegacion principal">
        <a href="/">Inicio</a>
        <a href="/carta">Carta</a>
        <a class="nav-action" href="tel:{{ site.phone }}">Llamar</a>
    </nav>
</header>
