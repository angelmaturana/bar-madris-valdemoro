services:
  - type: web
    name: local-web-generator
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_SITE_URL
        sync: false
      - key: KEEPALIVE_URL
        sync: false
      - key: KEEPALIVE_INTERVAL_SECONDS
        value: "300"
      - key: KEEPALIVE_TIMEOUT_SECONDS
        value: "10"