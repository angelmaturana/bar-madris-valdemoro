services:
  - type: web
    name: local-web-generator
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_SITE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12
